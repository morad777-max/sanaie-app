<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق صنايعي-إن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 400px; background: white; margin: 30px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #d97706; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: Tahoma; }
        button { background: #d97706; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #b45309; }
        .card { background: #fffbeb; border: 1px solid #fde68a; padding: 12px; margin: 10px 0; border-radius: 8px; text-align: right; }
        .hidden { display: none; }
        .nav-btn { background: #4b5563; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="container">
        <h2>🔧 صنايعي-إن</h2>
        <p>وصّلك بالصنايعي المناسب</p>
        <select id="userRole">
            <option value="client">تسجيل كعميل</option>
            <option value="worker">تسجيل كصنايعي</option>
        </select>
        <input type="text" id="phone" placeholder="رقم الهاتف المحمول">
        <button onclick="login()">دخول</button>
    </div>

    <!-- شاشة العميل (طلب خدمة) -->
    <div id="clientScreen" class="container hidden">
        <h2>طلب خدمة جديدة</h2>
        <select id="category">
            <option value="سباكة">سباكة</option>
            <option value="كهرباء">كهرباء</option>
            <option value="تكييف">تكييف</option>
            <option value="نجارة">نجارة</option>
            <option value="نقاشة">نقاشة</option>
        </select>
        <textarea id="desc" placeholder="صف المشكلة باختصار..." rows="3"></textarea>
        <input type="number" id="price" placeholder="السعر المقترح (ج.م)">
        <button onclick="addRequest()">نشر الطلب</button>
        <button class="nav-btn" onclick="showScreen('workerScreen')">عرض الطلبات المتاحة</button>
    </div>

    <!-- شاشة الصنايعي (عرض الطلبات) -->
    <div id="workerScreen" class="container hidden">
        <h2>الطلبات المتاحة</h2>
        <div id="requestsList"></div>
        <button class="nav-btn" onclick="showScreen('clientScreen')">العودة للطلبات</button>
    </div>

    <script>
        let requests = JSON.parse(localStorage.getItem('requests')) || [];

        function login() {
            const phone = document.getElementById('phone').value;
            if(phone.length < 10) {
                alert('الرجاء إدخال رقم هاتف صحيح');
                return;
            }
            showScreen('clientScreen');
        }

        function showScreen(screenId) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('clientScreen').classList.add('hidden');
            document.getElementById('workerScreen').classList.add('hidden');
            
            document.getElementById(screenId).classList.remove('hidden');
            if(screenId === 'workerScreen') renderRequests();
        }

        function addRequest() {
            const cat = document.getElementById('category').value;
            const desc = document.getElementById('desc').value;
            const price = document.getElementById('price').value;

            if(!desc || !price) {
                alert('الرجاء إكمال كافة البيانات');
                return;
            }

            requests.push({category: cat, description: desc, price: price});
            localStorage.setItem('requests', JSON.stringify(requests));
            
            alert('تم نشر الطلب وحفظه بنجاح!');
            document.getElementById('desc').value = '';
            document.getElementById('price').value = '';
            showScreen('workerScreen');
        }

        function renderRequests() {
            const list = document.getElementById('requestsList');
            if(requests.length === 0) {
                list.innerHTML = '<p>لا توجد طلبات متاحة حالياً</p>';
                return;
            }
            list.innerHTML = requests.map(r => `
                <div class="card">
                    <strong>التخصص: ${r.category}</strong><br>
                    الوصف: ${r.description}<br>
                    السعر: ${r.price} ج.م<br>
                    <button onclick="alert('تم التقديم على الطلب بنجاح!')" style="padding:6px; margin-top:8px;">تقديم عرض</button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
